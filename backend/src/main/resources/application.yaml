spring:
  main:
    banner-mode: off
  application:
    name: ${APP_NAME:cinema-booking}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinema_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    # hikari:
    #   maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate        # use "validate" + Flyway/Liquibase in production
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          #time_zone: UTC
        #format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: ${TZ:Asia/Ho_Chi_Minh}

server:
  port: ${SERVER_PORT:8001}


